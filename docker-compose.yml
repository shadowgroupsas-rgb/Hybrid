version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: copower_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - copower_net

volumes:
  postgres_data:

networks:
  copower_net:
