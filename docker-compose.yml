services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:dev
    environment:
      NODE_ENV: development
      TZ: America/Bogota
      # Networking
      DB_HOST: db
      DB_PORT: 5432
      # Credentials
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # App Config
      DB_SSL: "false"
      DB_SYNC: "true"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - copower_net

  db:
    image: postgis/postgis:15-3.3
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cronos_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - copower_net

volumes:
  postgres_data:

networks:
  copower_net:
