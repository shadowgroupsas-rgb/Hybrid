services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      TZ: America/Bogota
      # Explicit overrides for Docker networking
      DB_HOST: db
      DB_PORT: 5432
      # Ensure these match what's in .env or provide defaults
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_SSL: "false"
      DB_SYNC: "false"
    depends_on:
      - db
    networks:
      - copower_net

  db:
    image: postgis/postgis:15-3.3
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - copower_net

volumes:
  postgres_data:

networks:
  copower_net:
